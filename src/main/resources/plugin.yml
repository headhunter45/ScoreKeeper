name: ScoreKeeper
main: com.majinnaibu.minecraft.plugins.scorekeeper.ScoreKeeperPlugin
version: ${version}
api-version: '26.2'
commands:
    score-get:
        description: Displays the player's score.
        usage: /score-get [playername]
    score-add:
        description: Adds point to the player's score.
        usage: /score-add [playername] <amount>
    score-subtract:
        description: Subtracts points from the player's score.
        usage: /score-subtract [playername] <amount>
    score-reset:
        description: Resets the player's score
        usage: /score-reset [playername]
    score-archive:
        description: Archives and resets the player's score
        usage: /score-archive [playername]
    score-archive-list:
        description: Lists saved score archives or displays one archive.
        usage: /score-archive-list [archiveId]
    score-bucket:
        description: Selects or manages score buckets.
        usage: /score-bucket [bucketId] | create <id> <singular> <plural> <initialValue> [admin|global|player|none] | <player|all> <bucketId>
    score-run:
        description: Starts or stops a high-score run.
        usage: /score-run start <bucket> <topN> <reset:true|false> <target <score>|duration <time>|until-disabled> | /score-run stop <bucket>
permissions:
    scorekeeper.admin:
        description: Allows managing score buckets.
        default: op
        