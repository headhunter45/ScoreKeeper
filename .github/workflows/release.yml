name: Release

# Publishes a release for an existing v* tag: validates the tag, requires that CI
# (gradle.yml, job "Build and Test") already passed on the tagged commit, rebuilds,
# publishes the GitHub release (promoting the draft that gradle.yml created for the tag,
# if there is one), and only then publishes to Modrinth.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to release (e.g., v1.0.0). -dev tags are never released.'
        required: true
        type: string

permissions:
  contents: write
  checks: read

env:
  # Must match the job name in gradle.yml.
  CI_CHECK_NAME: Build and Test

jobs:
  prepare-release:
    name: Validate Tag & Prepare Release Branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag_commit: ${{ steps.validate.outputs.tag_commit }}
      tag_name: ${{ steps.validate.outputs.tag_name }}
      release_branch: ${{ steps.branches.outputs.release_branch }}
      version_name: ${{ steps.validate.outputs.version_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Validate tag
        id: validate
        env:
          TAG: ${{ inputs.tag }}
        run: |
          fail() {
            echo "::error title=Cannot release ${TAG}::$1"
            printf '### Release refused: %s\n\n%s\n' "$TAG" "$1" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          echo "Target tag: $TAG"
          git fetch origin --tags --force

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            fail "'$TAG' is not a release tag. Tags look like v1.2.3 (or v1.2.3-rc1)."
          fi
          if [[ "$TAG" == *-dev ]]; then
            fail "'$TAG' is a development tag; -dev versions are never released."
          fi
          if ! git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            fail "Tag '$TAG' does not exist in the repository. Create and push it first."
          fi

          TAG_COMMIT=$(git rev-list -n 1 "$TAG")
          echo "Tag '$TAG' points to commit: $TAG_COMMIT"

          # The build derives its version from the tags on the commit; make sure that is this tag.
          COMPUTED=$(./tools/compute-version.sh "$TAG_COMMIT")
          if [[ "$COMPUTED" != "${TAG#v}" ]]; then
            fail "Commit ${TAG_COMMIT:0:12} would build as version $COMPUTED, not ${TAG#v}, because it carries other tags (tools/compute-version.sh prefers the greatest release tag on a commit). Release the tag matching v$COMPUTED, or remove the extra tags."
          fi

          {
            echo "tag_commit=$TAG_COMMIT"
            echo "tag_name=$TAG"
            echo "version_name=${TAG#v}"
          } >> "$GITHUB_OUTPUT"

      # Nothing below changes any branch until this passes.
      - name: Require a passing CI build for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ steps.validate.outputs.tag_commit }}
          LABEL: ${{ inputs.tag }}
          CHECK_NAME: ${{ env.CI_CHECK_NAME }}
        run: ./.github/scripts/require-passing-build.sh

      - name: Verify develop and main, create release branch
        id: branches
        env:
          TAG: ${{ steps.validate.outputs.tag_name }}
          TAG_COMMIT: ${{ steps.validate.outputs.tag_commit }}
        run: |
          # Fetch remote branches and tags
          git fetch origin develop main --tags --force

          # 1. Verify tag commit is in develop branch
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/develop; then
            echo "::error::Tag '$TAG' (commit $TAG_COMMIT) is not in the develop branch."
            exit 1
          fi
          echo "Confirmed: Tag '$TAG' is in develop branch."

          # 2. Verify tag commit is in main, or fast-forward merge it to main
          if git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "Confirmed: Tag '$TAG' is already in main branch."
          else
            echo "Tag '$TAG' is not in main. Attempting fast-forward only merge..."
            git checkout -B main origin/main
            if ! git merge --ff-only "$TAG_COMMIT"; then
              echo "::error::Tag '$TAG' cannot be fast-forward merged into main."
              exit 1
            fi
            git push origin main
            echo "Successfully fast-forward merged '$TAG' into main."
          fi

          # 3. Create and push the release/v* branch from the tag commit
          RELEASE_BRANCH="release/${TAG}"
          echo "Creating release branch '$RELEASE_BRANCH' from commit $TAG_COMMIT..."
          git checkout -B "$RELEASE_BRANCH" "$TAG_COMMIT"
          git push -u origin "$RELEASE_BRANCH" --force
          echo "release_branch=$RELEASE_BRANCH" >> "$GITHUB_OUTPUT"

  release:
    name: Build, Test & Publish Release
    needs: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAG: ${{ needs.prepare-release.outputs.tag_name }}
      VERSION: ${{ needs.prepare-release.outputs.version_name }}

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release.outputs.tag_commit }}
          fetch-depth: 0

      - name: Ensure tag ref is checked out
        run: git checkout -q "refs/tags/$TAG"

      - name: Validate Modrinth Credentials
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          if [ -z "$MODRINTH_TOKEN" ]; then
            echo "::error title=Missing MODRINTH_TOKEN::Configure the MODRINTH_TOKEN repository secret. Nothing has been published."
            exit 1
          fi

      - name: Prepare release notes from changelog.md
        run: |
          header_version=$(./tools/changelog.sh get-version 2>/dev/null || true)
          if [[ "$header_version" != "$VERSION" ]]; then
            echo "::warning title=changelog.md header says '${header_version:-missing}'::Releasing ${VERSION}, as tagged. Only the notes under the header are used."
          fi
          if ! ./tools/changelog.sh notes > "$RUNNER_TEMP/release-notes.md" 2> "$RUNNER_TEMP/notes-error.txt"; then
            error=$(cat "$RUNNER_TEMP/notes-error.txt")
            echo "::error title=No release notes for ${TAG}::${error}"
            printf '### Release refused: %s\n\n%s\n' "$TAG" "$error" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          { echo "### Release notes for $TAG"; echo; cat "$RUNNER_TEMP/release-notes.md"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle 9.8.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.0'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-test-report-${{ needs.prepare-release.outputs.tag_name }}
          path: |
            build/reports/tests/test
            build/test-results/test
          if-no-files-found: ignore
          retention-days: 14

      - name: Build Plugin Jar
        run: ./tools/build-plugin.sh

      - name: Upload Release Jar
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-${{ needs.prepare-release.outputs.version_name }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

      # Before Modrinth, so there is never a Modrinth version without a GitHub release and jar.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag_name }}
          name: ${{ github.event.repository.name }} ${{ needs.prepare-release.outputs.tag_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          draft: false
          prerelease: ${{ contains(needs.prepare-release.outputs.version_name, '-') }}
          files: build/libs/*.jar
          fail_on_unmatched_files: true

      - name: Publish to Modrinth & Update Description
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_VERSION: ${{ needs.prepare-release.outputs.version_name }}
        run: |
          export MODRINTH_CHANGELOG="$(cat "$RUNNER_TEMP/release-notes.md")"
          chmod +x ./tools/publish-modrinth.sh
          ./tools/publish-modrinth.sh
